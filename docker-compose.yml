services:
  # Backend NestJS
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autosaller_backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
    depends_on:
      - postgres
    # Removido os volumes para usar apenas os gerados pela imagem.
    #volumes:
      #- ./backend:/app
      #- /app/node_modules

  # Banco de Dados (Postgresql)
  postgres:
    image: postgres:15-alpine
    container_name: autosaller_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Frontend VueJS
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autosaller_frontend
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
